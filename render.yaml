# Render Blueprint for the FinShield API. Create it from the dashboard:
# New > Blueprint > this repository.
services:
  - type: web
    name: finshield-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # The Vercel production origin, exactly: scheme and host, no trailing slash.
      # Comma-separate to add more. Unset, the API allows any origin.
      - key: ALLOWED_ORIGINS
        value: https://finshield-mu.vercel.app
      # Vercel's branch and preview addresses for this project, such as
      # finshield-git-main-spendsense-s-projects.vercel.app. The API sends no
      # credentials and serves only synthetic data, so this widens nothing sensitive.
      - key: ALLOWED_ORIGIN_REGEX
        value: https://finshield-[a-z0-9-]+-spendsense-s-projects\.vercel\.app
      # Which model writes explanations and answers questions: gemini, ollama or
      # none. Unset, Gemini is used when GEMINI_API_KEY is set.
      - key: LLM_PROVIDER
        value: gemini
      # Google AI Studio key. Gemini has a free tier, so the hosted demo uses it.
      - key: GEMINI_API_KEY
        sync: false
      # Optional model override, e.g. a newer Gemini model. Defaults per provider.
      - key: LLM_MODEL
        sync: false
      # Language-model budgets for the public demo. Scores never count against
      # them; past a limit, explanations use the fallback and /ask returns 429.
      # Per visitor per minute, and in total per UTC day. 0 disables a limit.
      - key: ASK_PER_MINUTE
        value: "5"
      - key: ASK_PER_DAY
        value: "100"
      - key: EXPLAIN_PER_MINUTE
        value: "20"
      - key: EXPLAIN_PER_DAY
        value: "500"
