# Render Blueprint for the FinShield API. Create it from the dashboard:
# New > Blueprint > this repository.
services:
  - type: web
    name: finshield-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # The Vercel production origin, exactly: scheme and host, no trailing slash.
      # Comma-separate to add more. Unset, the API allows any origin.
      - key: ALLOWED_ORIGINS
        value: https://finshield-mu.vercel.app
      # Optional. Without it, explanations use the deterministic fallback.
      - key: ANTHROPIC_API_KEY
        sync: false
