# Render Blueprint for the FinShield API. Create it from the dashboard:
# New > Blueprint > this repository.
services:
  - type: web
    name: finshield-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # The Vercel production origin, exactly: scheme and host, no trailing slash.
      # Comma-separate to add more. Unset, the API allows any origin.
      - key: ALLOWED_ORIGINS
        value: https://finshield-mu.vercel.app
      # Vercel's branch and preview addresses for this project, such as
      # finshield-git-main-spendsense-s-projects.vercel.app. The API sends no
      # credentials and serves only synthetic data, so this widens nothing sensitive.
      - key: ALLOWED_ORIGIN_REGEX
        value: https://finshield-[a-z0-9-]+-spendsense-s-projects\.vercel\.app
      # Optional. Without it, explanations use the deterministic fallback.
      - key: ANTHROPIC_API_KEY
        sync: false
